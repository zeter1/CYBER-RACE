name: Bug report
description: Сообщить о воспроизводимой проблеме в CYBER RACE
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: browser
    attributes:
      label: Браузер и версия
      placeholder: "Chrome 140 / Firefox 142"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU / WebGL
      description: Видеокарта и важная информация из chrome://gpu или аналогичного экрана, если проблема графическая.
      placeholder: "RTX 4060, WebGL2 enabled"

  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Запуск / загрузка Three.js
        - Управление автомобилем
        - AI соперников
        - Пулемёт / ракеты / combat
        - Нитро / защитный импульс / бонусы
        - Web Audio
        - Производительность / FPS / качество
        - WebGL context / rendering
        - Рекорды / localStorage
        - Другое
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Открыть ...
        2. Выбрать ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true

  - type: input
    id: perf
    attributes:
      label: Режим качества / FPS
      placeholder: "Auto, ~45 FPS"

  - type: textarea
    id: console
    attributes:
      label: DevTools Console
      description: Небольшой релевантный фрагмент без секретов.
      render: text
